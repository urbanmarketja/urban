[build]
  base = "frontend"
  command = "npm ci && npm run build:netlify"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store"
